  <text x="120" y="972" font-family="Poppins, sans-serif" font-weight="700" font-size="26" fill="#221F1A">+91 94 94 94 28 94</text>
  <text x="960" y="972" text-anchor="end" font-family="Poppins, sans-serif" font-weight="600" font-size="24" letter-spacing="2" fill="#5C564D">saraswatinagri.com</text>
